<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حضور و غیاب دوره‌های ضمن خدمت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1B2E3C; --ink-soft:#3E5568; --paper:#EEF1EE; --paper-line:#D7DCD4; --line:#B9C4BC;
    --seal:#A63D40; --seal-soft:#E9D4D2; --ok:#3F6B4F; --ok-soft:#DCE8DE; --gold:#B08D2B; --card:#FAFAF7; --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--paper-line) 28px), var(--paper); color:var(--ink); font-family:'Vazirmatn', sans-serif; min-height:100vh; padding:0 0 40px; }

  .credit-banner{ text-align:center; background:var(--ink); color:var(--gold); font-weight:700; font-size:13px; padding:9px 10px; animation: blinkGlow 1.7s ease-in-out infinite; }
  @keyframes blinkGlow{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

  header{ background:var(--ink); color:var(--paper); padding:16px 18px 14px; border-bottom:3px solid var(--gold); }
  header .eyebrow{ font-size:12px; color:#9FB2C0; margin:0 0 4px; }
  header h1{ margin:0; font-size:18px; font-weight:700; line-height:1.5; }
  header .sched{ font-size:12px; color:#B7C6D0; margin-top:6px; line-height:1.8; }

  .admin-bar{ background:#12212C; padding:7px 14px; display:flex; align-items:center; justify-content:flex-end; gap:8px; font-size:12px; color:#9FB2C0; flex-wrap:wrap; }
  .admin-bar input{ font-family:inherit; font-size:12.5px; padding:6px 8px; border-radius:3px; border:1px solid #3A4B58; width:120px; }
  .admin-bar .err{ color:#F0A6A8; font-size:11px; width:100%; text-align:left; }

  nav.tabs{ display:flex; gap:2px; background:var(--ink); padding:0 12px; overflow-x:auto; }
  nav.tabs button{ appearance:none; border:none; background:transparent; color:#A9BCC9; font-family:inherit; font-size:13px; padding:11px 13px; border-radius:6px 6px 0 0; cursor:pointer; white-space:nowrap; }
  nav.tabs button.active{ background:var(--paper); color:var(--ink); font-weight:700; }

  main{ max-width:1000px; margin:0 auto; padding:20px 16px 0; }
  main.wide{ max-width:100%; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .report-card{ width:fit-content; max-width:100%; }
  .card h2{ margin:0 0 4px; font-size:16px; font-weight:700; }
  .card .sub{ margin:0 0 14px; font-size:13px; color:var(--ink-soft); }

  .section-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); border-bottom:1px dashed var(--line); padding-bottom:6px; margin:18px 0 4px; }
  .section-label:first-of-type{ margin-top:4px; }

  label{ display:block; font-size:12.5px; font-weight:600; margin:10px 0 4px; }
  select, input[type=text], input[type=number], input[type=password], textarea{
    width:100%; font-family:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line); border-radius:var(--radius); background:#fff; color:var(--ink);
  }
  input[readonly]{ background:var(--paper); color:var(--ink-soft); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  @media(max-width:480px){ .grid2{ grid-template-columns:1fr; } }

  .radio-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-row label{ display:flex; align-items:center; gap:6px; font-weight:500; border:1px solid var(--line); padding:8px 12px; border-radius:20px; margin:0; cursor:pointer; background:#fff; font-size:13px; }
  .radio-row input{ accent-color:var(--seal); }
  .radio-row label.checked{ border-color:var(--seal); background:var(--seal-soft); }
  .radio-row label.disabled-opt{ opacity:.4; cursor:not-allowed; }

  .primary-btn{ margin-top:18px; width:100%; background:var(--seal); color:#fff; border:none; font-family:inherit; font-size:15px; font-weight:700; padding:13px; border-radius:var(--radius); cursor:pointer; }
  .primary-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .ghost-btn{ background:#fff; border:1px solid var(--line); color:var(--ink); font-family:inherit; font-size:12.5px; padding:8px 12px; border-radius:var(--radius); cursor:pointer; }
  .confirm{ margin-top:14px; background:var(--ok-soft); border:1px solid var(--ok); color:#1F3B29; padding:12px 14px; border-radius:var(--radius); font-size:13px; }
  .warn{ margin-top:14px; background:var(--seal-soft); border:1px solid var(--seal); color:#5C1E20; padding:12px 14px; border-radius:var(--radius); font-size:13px; }
  .info-line{ margin:10px 0; font-size:12.5px; color:var(--ink-soft); }
  .reuse-note{ font-size:12px; color:var(--ok); margin:8px 0; }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar select{ width:auto; flex:1; min-width:120px; }

  .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--radius); }
  table{ border-collapse:separate; border-spacing:0; font-size:12px; }
  thead th{ background:var(--card); color:var(--ink-soft); font-weight:700; text-align:right; padding:8px 6px; border-bottom:2px solid var(--gold); white-space:nowrap; }
  tbody td{ padding:7px 6px; border-bottom:1px solid var(--paper-line); text-align:right; background:var(--card); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  tbody tr:nth-child(even) td{ background:#F2F3EF; }
  .sticky-col{ position:sticky; z-index:2; }
  thead .sticky-col{ z-index:3; }
  .sticky-col.sticky-last{ box-shadow:-6px 0 6px -6px rgba(0,0,0,.28); }
  .empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0; }

  .dash-title{ font-size:17px; font-weight:800; margin-bottom:4px; }
  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0; }
  @media(max-width:640px){ .kpi-grid{ grid-template-columns:1fr 1fr; } }
  .kpi-box{ background:#fff; border-radius:6px; padding:14px 10px; text-align:center; border-top:4px solid var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .kpi-navy{ border-color:var(--ink); } .kpi-green{ border-color:var(--ok); } .kpi-red{ border-color:var(--seal); } .kpi-gold{ border-color:var(--gold); }
  .kpi-num{ font-size:24px; font-weight:800; }
  .kpi-label{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .progress-track{ height:6px; background:var(--paper-line); border-radius:4px; margin-top:8px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--gold); }

  .course-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  @media(max-width:640px){ .course-grid{ grid-template-columns:1fr; } }
  .course-box{ border-radius:6px; padding:14px; text-align:center; color:#fff; }
  .course-0{ background:linear-gradient(135deg,#A63D40,#c25659); }
  .course-1{ background:linear-gradient(135deg,#3E5568,#547089); }
  .course-2{ background:linear-gradient(135deg,#3F6B4F,#568f68); }
  .course-name{ font-size:13px; font-weight:700; }
  .course-count{ font-size:22px; font-weight:800; margin-top:4px; }
  .top-line{ background:#fff; border:1px dashed var(--gold); border-radius:6px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .charts-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; }
  @media(max-width:720px){ .charts-grid{ grid-template-columns:1fr; } }
  .chart-box{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px; }
</style>
</head>
<body>

<div class="credit-banner">طراح و برنامه‌نویس: مهندس ایوب رشیدی &nbsp;|&nbsp; تماس: ۰۹۳۸۰۳۵۶۸۷۸</div>

<header>
  <p class="eyebrow">دوره‌های ضمن‌خدمت — ریاضیات · فارسی · هوش مصنوعی</p>
  <h1>حضور و غیاب با کد QR</h1>
  <p class="sched">۲۱ تا ۳۰ شهریور ۱۴۰۵ — زنگ اول ۸:۰۰ تا ۱۰:۰۰ ، استراحت ۱۰:۰۰ تا ۱۰:۳۰ ، زنگ دوم ۱۰:۳۰ تا ۱۲:۳۰</p>
</header>

<div id="adminBar"></div>
<nav class="tabs" id="tabs" style="display:none;">
  <button data-tab="checkin" class="active">ثبت‌نام</button>
  <button data-tab="codes">QR ورود</button>
  <button data-tab="report">گزارش</button>
  <button data-tab="dashboard">داشبورد</button>
  <button data-tab="admin">مدیریت</button>
</nav>

<main id="app"></main>

<script>
const GRADES = ['اول','دوم','سوم','چهارم','پنجم','ششم'];
const COURSES = ['ریاضیات','فارسی','هوش مصنوعی'];
const DEGREES = ['دیپلم','کاردانی','کارشناسی','کارشناسی ارشد','دکتری'];
const MARITAL = ['مجرد','متأهل'];
const GENDERS = ['مرد','زن'];
const PERIODS = [
  {id:'p1', label:'زنگ اول', time:'۸:۰۰ تا ۱۰:۰۰'},
  {id:'p2', label:'زنگ دوم', time:'۱۰:۳۰ تا ۱۲:۳۰'},
];
const SESSION_DATES = [
  {jalali:'1405/06/21', gregorian:'2026-09-12', label:'شنبه ۲۱ شهریور ۱۴۰۵'},
  {jalali:'1405/06/22', gregorian:'2026-09-13', label:'یکشنبه ۲۲ شهریور ۱۴۰۵'},
  {jalali:'1405/06/23', gregorian:'2026-09-14', label:'دوشنبه ۲۳ شهریور ۱۴۰۵'},
  {jalali:'1405/06/24', gregorian:'2026-09-15', label:'سه‌شنبه ۲۴ شهریور ۱۴۰۵'},
  {jalali:'1405/06/25', gregorian:'2026-09-16', label:'چهارشنبه ۲۵ شهریور ۱۴۰۵'},
  {jalali:'1405/06/26', gregorian:'2026-09-17', label:'پنجشنبه ۲۶ شهریور ۱۴۰۵'},
  {jalali:'1405/06/27', gregorian:'2026-09-18', label:'جمعه ۲۷ شهریور ۱۴۰۵'},
  {jalali:'1405/06/28', gregorian:'2026-09-19', label:'شنبه ۲۸ شهریور ۱۴۰۵'},
  {jalali:'1405/06/29', gregorian:'2026-09-20', label:'یکشنبه ۲۹ شهریور ۱۴۰۵'},
  {jalali:'1405/06/30', gregorian:'2026-09-21', label:'دوشنبه ۳۰ شهریور ۱۴۰۵'},
];

const STICKY_COLS = [
  {key:'row', label:'ردیف', width:44}, {key:'firstName', label:'نام', width:80},
  {key:'lastName', label:'نام خانوادگی', width:104}, {key:'grade', label:'پایه', width:56},
  {key:'sessionDateLabel', label:'تاریخ', width:150},
  {key:'p1Html', label:'زنگ اول', width:150}, {key:'p2Html', label:'زنگ دوم', width:150},
];
const SCROLL_COLS = [
  {key:'personnelCode', label:'کد پرسنلی', width:90}, {key:'nationalCode', label:'کد ملی', width:90},
  {key:'gender', label:'جنسیت', width:64}, {key:'birthDate', label:'تاریخ تولد', width:100},
  {key:'maritalStatus', label:'وضعیت تأهل', width:90}, {key:'orgPosition', label:'سمت سازمانی', width:130},
  {key:'degree', label:'مدرک تحصیلی', width:110}, {key:'teachingExperience', label:'سابقه تدریس', width:90},
  {key:'phone', label:'تلفن همراه', width:110}, {key:'workAddress', label:'آدرس محل کار', width:170},
  {key:'homeAddress', label:'آدرس منزل', width:170},
];
const ALL_COLS = STICKY_COLS.concat(SCROLL_COLS);

let ADMIN_TOKEN = localStorage.getItem('adminToken');
let ADMIN_USERNAME = localStorage.getItem('adminUsername') || '';
let SHOW_LOGIN = false;
let ADMIN_DATA = {records:[], teacherProfiles:{}};

let ACTIVE_TAB = 'checkin';
let CHARTS = {bar:null, donut:null};
let DEVICE_STATUS = null; // {found, firstName, lastName, grade, filledPeriods} for the currently selected date

function toEnglishDigits(str){
  return String(str).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function toFa(n){ return String(n).replace(/[0-9]/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function downloadBlob(bufferOrBlob, filename, mime){
  const blob = bufferOrBlob instanceof Blob ? bufferOrBlob : new Blob([bufferOrBlob], {type:mime});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function qrUrl(targetUrl){ return 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(targetUrl); }
function authHeaders(){ return ADMIN_TOKEN ? {Authorization:'Bearer '+ADMIN_TOKEN} : {}; }
function getDeviceId(){
  let id = localStorage.getItem('deviceId');
  if(!id){ id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10); localStorage.setItem('deviceId', id); }
  return id;
}

/* ---------- CHECK-IN ---------- */
async function checkDeviceStatus(sessionDate){
  DEVICE_STATUS = null;
  if(!sessionDate) return;
  try{
    const res = await fetch('/api/device-check', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({deviceId:getDeviceId(), sessionDate})});
    DEVICE_STATUS = await res.json();
  }catch(e){ console.error(e); }
}

function renderCheckin(){
  const remaining = (DEVICE_STATUS && DEVICE_STATUS.found)
    ? PERIODS.filter(p=> !DEVICE_STATUS.filledPeriods.includes(p.id))
    : null;

  // Both periods already used by this phone today -> block entirely
  if(remaining && remaining.length===0){
    return `
    <div class="card">
      <h2>ثبت‌نام و حضور معلم</h2>
      <div class="warn">این گوشی برای این تاریخ قبلاً هر دو زنگ (به نام ${DEVICE_STATUS.firstName} ${DEVICE_STATUS.lastName}) را ثبت کرده است. برای ثبت نام فرد دیگری، از گوشیِ خودِ آن فرد استفاده کنید.</h2>
    </div>`;
  }

  // Exactly one period already used by this phone today -> simplified second entry
  if(remaining && remaining.length===1){
    const p = remaining[0];
    return `
    <div class="card">
      <h2>ثبت حضور ${p.label}</h2>
      <p class="sub">شما (${DEVICE_STATUS.firstName} ${DEVICE_STATUS.lastName} — پایه ${DEVICE_STATUS.grade}) با همین گوشی برای این تاریخ قبلاً ثبت کرده‌اید. فقط کافی است ${p.label} را ثبت کنید — نیازی به وارد کردن دوباره‌ی مشخصات نیست.</p>
      <input type="hidden" id="simplifiedMode" value="1">
      <input type="hidden" id="firstName" value="${DEVICE_STATUS.firstName}">
      <input type="hidden" id="lastName" value="${DEVICE_STATUS.lastName}">
      <input type="hidden" id="grade" value="${DEVICE_STATUS.grade}">
      <input type="hidden" id="period" value="${p.id}">
      <label>نام دوره</label>
      <div class="radio-row" id="courseRow">${COURSES.map(c=>`<label><input type="radio" name="course" value="${c}"> ${c}</label>`).join('')}</div>
      <label>مدرس دوره</label>
      <input type="text" id="instructor" placeholder="نام مدرس این جلسه">
      <button class="primary-btn" id="submitBtn">ثبت ${p.label}</button>
      <div id="confirmBox"></div>
    </div>`;
  }

  // Fresh check-in: full form
  return `
  <div class="card">
    <h2>ثبت‌نام و حضور معلم</h2>
    <p class="sub">دوره‌های ضمن‌خدمت ریاضیات، فارسی و هوش مصنوعی — ۲۱ تا ۳۰ شهریور ۱۴۰۵</p>

    <div class="section-label">اطلاعات جلسه</div>
    <div class="grid2">
      <div><label>پایه</label><select id="grade"><option value="">— انتخاب کنید —</option>${GRADES.map(g=>`<option value="${g}">پایه ${g}</option>`).join('')}</select></div>
      <div><label>تاریخ جلسه</label><select id="sessionDate"><option value="">— انتخاب کنید —</option>${SESSION_DATES.map(d=>`<option value="${d.jalali}">${d.label}</option>`).join('')}</select></div>
    </div>

    <label>زنگ</label>
    <div class="radio-row" id="periodRow">${PERIODS.map(p=>`<label><input type="radio" name="period" value="${p.id}"> ${p.label} (${p.time})</label>`).join('')}</div>

    <label>نام دوره</label>
    <div class="radio-row" id="courseRow">${COURSES.map(c=>`<label><input type="radio" name="course" value="${c}"> ${c}</label>`).join('')}</div>

    <label>مدرس دوره</label>
    <input type="text" id="instructor" placeholder="نام مدرس این جلسه">

    <div class="section-label">اطلاعات فردی معلم</div>
    <div class="grid2">
      <div><label>نام</label><input type="text" id="firstName"></div>
      <div><label>نام خانوادگی</label><input type="text" id="lastName"></div>
    </div>
    <div id="reuseNote" class="reuse-note"></div>

    <div class="grid2">
      <div><label>کد پرسنلی</label><input type="text" id="personnelCode" inputmode="numeric"></div>
      <div><label>کد ملی</label><input type="text" id="nationalCode" inputmode="numeric" maxlength="10"></div>
    </div>
    <div class="grid2">
      <div><label>جنسیت</label><select id="gender"><option value="">— انتخاب —</option>${GENDERS.map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div>
      <div><label>تاریخ تولد</label><input type="text" id="birthDate" placeholder="مثلاً ۱۳۶۵/۰۳/۱۲"></div>
    </div>
    <div class="grid2">
      <div><label>وضعیت تأهل</label><select id="maritalStatus"><option value="">— انتخاب —</option>${MARITAL.map(m=>`<option value="${m}">${m}</option>`).join('')}</select></div>
      <div><label>سمت سازمانی</label><input type="text" id="orgPosition" placeholder="مثلاً معلم پایه چهارم"></div>
    </div>
    <div class="grid2">
      <div><label>مدرک تحصیلی</label><select id="degree"><option value="">— انتخاب —</option>${DEGREES.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
      <div><label>سابقه تدریس (سال)</label><input type="number" id="teachingExperience" min="0" max="45"></div>
    </div>
    <label>تلفن همراه</label><input type="text" id="phone" inputmode="numeric" placeholder="مثلاً ۰۹۱۲۳۴۵۶۷۸۹">
    <label>آدرس محل کار</label><input type="text" id="workAddress">
    <label>آدرس منزل</label><input type="text" id="homeAddress">

    <button class="primary-btn" id="submitBtn">ثبت حضور من</button>
    <div id="confirmBox"></div>
  </div>`;
}

/* ---------- QR (single, admin-only) ---------- */
function renderCodes(){
  const base = location.href.split('?')[0];
  return `
  <div class="card">
    <h2>کد QR ورود (تنها کد سیستم)</h2>
    <p class="sub">معلمان با اسکن همین یک کد مستقیم وارد فرم ثبت‌نام می‌شوند و پایه/تاریخ/زنگ/دوره را خودشان انتخاب می‌کنند.</p>
    <div style="text-align:center; padding:16px;">
      <img src="${qrUrl(base)}" style="width:220px; height:220px;">
      <div id="linkText" style="margin-top:10px; font-size:12px; color:var(--ink-soft); word-break:break-all;">${base}</div>
      <button class="ghost-btn" id="copyLinkBtn" style="margin-top:8px;">📋 کپی لینک</button>
      <div id="copyMsg" style="font-size:11.5px; color:var(--ok); margin-top:4px;"></div>
    </div>
    <div class="info-line" style="margin-top:10px;">اگر کسی گوشی‌اش بارکدخوان/QR‌خوان ندارد: همین لینک بالا را کپی کنید و از طریق پیامک، گروه واتساپ/تلگرام، یا نوشتن روی تابلوی محل برگزاری در اختیارش بگذارید.</div>
  </div>`;
}

/* ---------- REPORT (records already arrive pre-merged: one row per teacher/day) ---------- */
function periodCellHtml(rec){
  if(!rec) return '<span style="color:var(--ink-soft);">—</span>';
  const statusHtml = rec.status==='تأخیر'
    ? `<span style="color:var(--seal); font-weight:700;">تأخیر (${toFa(rec.delayMinutes)} د)</span>`
    : (rec.status==='حاضر' ? `<span style="color:var(--ok); font-weight:700;">حاضر</span>` : `<span style="color:var(--ink-soft); font-weight:600;">ثبت‌شده</span>`);
  const t = new Date(rec.submittedAt).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
  return `${rec.course}<br>${statusHtml} — ${t}`;
}
function buildRowDisplay(g, idx){
  const dateInfo = SESSION_DATES.find(d=>d.jalali===g.sessionDate);
  return Object.assign({}, g, {
    row: toFa(idx+1), sessionDateLabel: dateInfo?dateInfo.label:g.sessionDate,
    p1Html: periodCellHtml(g.p1), p2Html: periodCellHtml(g.p2),
  });
}
function stickyOffsets(){ let acc=0; return STICKY_COLS.map(c=>{ const off=acc; acc+=c.width; return off; }); }
function reportHeaderRow(){
  const offsets = stickyOffsets();
  const stickyTh = STICKY_COLS.map((c,i)=>`<th class="sticky-col${i===STICKY_COLS.length-1?' sticky-last':''}" style="right:${offsets[i]}px; width:${c.width}px; min-width:${c.width}px;">${c.label}</th>`).join('');
  const scrollTh = SCROLL_COLS.map(c=>`<th style="width:${c.width}px; min-width:${c.width}px;">${c.label}</th>`).join('');
  return stickyTh + scrollTh;
}
function reportRowHtml(g){
  const offsets = stickyOffsets();
  const stickyTd = STICKY_COLS.map((c,i)=>`<td class="sticky-col${i===STICKY_COLS.length-1?' sticky-last':''}" style="right:${offsets[i]}px; width:${c.width}px;">${g[c.key] ?? ''}</td>`).join('');
  const scrollTd = SCROLL_COLS.map(c=>`<td style="width:${c.width}px;">${g[c.key] ?? ''}</td>`).join('');
  return `<tr>${stickyTd}${scrollTd}</tr>`;
}
function getReportFilters(){ return window._reportFilters || {grade:'', date:'', course:''}; }
function filteredGroups(f){
  let rows = ADMIN_DATA.records.slice();
  if(f.grade) rows = rows.filter(r=>r.grade===f.grade);
  if(f.date) rows = rows.filter(r=>r.sessionDate===f.date);
  if(f.course) rows = rows.filter(r=> (r.p1 && r.p1.course===f.course) || (r.p2 && r.p2.course===f.course));
  rows = rows.slice().sort((a,b)=>{
    const ta = (a.p1?a.p1.submittedAt:'') > (a.p2?a.p2.submittedAt:'') ? (a.p1?a.p1.submittedAt:'') : (a.p2?a.p2.submittedAt:'');
    const tb = (b.p1?b.p1.submittedAt:'') > (b.p2?b.p2.submittedAt:'') ? (b.p1?b.p1.submittedAt:'') : (b.p2?b.p2.submittedAt:'');
    return tb.localeCompare(ta);
  });
  return rows;
}
function renderReport(){
  const f = getReportFilters();
  const rows = filteredGroups(f);
  const totalWidth = ALL_COLS.reduce((s,c)=>s+c.width,0);

  return `

    <p class="sub">هر معلم برای هر روز فقط یک سطر دارد؛ ثبت زنگ دوم فقط سلول همان زنگ را در همین سطر پر می‌کند.</p>
    <div class="toolbar">
      <select id="filterGrade"><option value="">همه پایه‌ها</option>${GRADES.map(g=>`<option value="${g}" ${f.grade===g?'selected':''}>پایه ${g}</option>`).join('')}</select>
      <select id="filterDate"><option value="">همه تاریخ‌ها</option>${SESSION_DATES.map(d=>`<option value="${d.jalali}" ${f.date===d.jalali?'selected':''}>${d.label}</option>`).join('')}</select>
      <select id="filterCourse"><option value="">همه دوره‌ها</option>${COURSES.map(c=>`<option value="${c}" ${f.course===c?'selected':''}>${c}</option>`).join('')}</select>
      <button class="ghost-btn" id="exportExcel">خروجی اکسل</button>

    ${displayRows.length ? `

    <p class="sub" style="margin-top:8px;">تعداد معلم (سطر): ${toFa(displayRows.length)}</p>
    ` : '<p class="empty">هنوز رکوردی ثبت نشده</p>'}
  </div>`;
}

/* ---------- DASHBOARD ---------- */
function defaultDashboardDate(){
  const todayIso = new Date().toISOString().slice(0,10);
  const match = SESSION_DATES.find(d=> d.gregorian === todayIso);
  return match ? match.jalali : '';
}
function computeDashboardStats(dateFilter){
  let rows = ADMIN_DATA.records.slice();
  if(dateFilter) rows = rows.filter(r=> r.sessionDate === dateFilter);
  let total=0, onTime=0, late=0;
  const byGrade = {}; GRADES.forEach(g=> byGrade[g]=0);
  const byCourse = {}; COURSES.forEach(c=> byCourse[c]=0);
  rows.forEach(r=>{
    ['p1','p2'].forEach(p=>{
      const slot = r[p];
      if(!slot) return;
      total++;
      if(slot.status==='حاضر') onTime++;
      if(slot.status==='تأخیر') late++;
      if(byGrade[r.grade]!==undefined) byGrade[r.grade]++;
      if(byCourse[slot.course]!==undefined) byCourse[slot.course]++;
    });
  });
  const pct = total ? Math.round((onTime/total)*100) : 0;
  let topGrade='-', topCount=-1;
  Object.keys(byGrade).forEach(g=>{ if(byGrade[g]>topCount){ topCount=byGrade[g]; topGrade=g; } });
  return {total, onTime, late, pct, byGrade, byCourse, topGrade, topCount};
}
function renderDashboard(){
  if(window._dashDate === undefined) window._dashDate = defaultDashboardDate();
  if(window._dashGrade === undefined) window._dashGrade = '';
  if(window._dashCourse === undefined) window._dashCourse = '';
  const dateFilter = window._dashDate, gradeFilter = window._dashGrade, courseFilter = window._dashCourse;
  const stats = computeDashboardStats(dateFilter);
  const rows = filteredGroups({grade:gradeFilter, date:dateFilter, course:courseFilter});
  const displayRows = rows.map(buildRowDisplay);
  const totalWidth = ALL_COLS.reduce((s,c)=>s+c.width,0);
  return `
  <div class="card" id="dashboardCapture">
    <div class="dash-title">داشبورد حضور و غیاب — دوره‌های ضمن‌خدمت</div>
    <p class="sub">${dateFilter ? (SESSION_DATES.find(d=>d.jalali===dateFilter)||{}).label : 'نمای کلی همه‌ی تاریخ‌ها'}</p>
    <div class="toolbar">
      <select id="dashDate"><option value="">همه تاریخ‌ها</option>${SESSION_DATES.map(d=>`<option value="${d.jalali}" ${dateFilter===d.jalali?'selected':''}>${d.label}</option>`).join('')}</select>
      <button class="ghost-btn" id="exportDashExcel">خروجی اکسل</button>
      <button class="ghost-btn" id="exportDashPdf">خروجی PDF</button>
    </div>
    <div class="kpi-grid">
      <div class="kpi-box kpi-navy"><div class="kpi-num">${toFa(stats.total)}</div><div class="kpi-label">کل ثبت‌نام‌ها</div></div>
      <div class="kpi-box kpi-green"><div class="kpi-num">${toFa(stats.onTime)}</div><div class="kpi-label">حاضر به‌موقع</div></div>
      <div class="kpi-box kpi-red"><div class="kpi-num">${toFa(stats.late)}</div><div class="kpi-label">با تأخیر</div></div>
      <div class="kpi-box kpi-gold"><div class="kpi-num">${toFa(stats.pct)}٪</div><div class="kpi-label">درصد به‌موقع بودن</div><div class="progress-track"><div class="progress-fill" style="width:${stats.pct}%;"></div></div></div>
    </div>
    <div class="course-grid">${COURSES.map((c,i)=>`<div class="course-box course-${i}"><div class="course-name">${c}</div><div class="course-count">${toFa(stats.byCourse[c]||0)}</div></div>`).join('')}</div>
    <div class="top-line">🏆 پایه با بیشترین شرکت‌کننده: <strong>${stats.topGrade!=='-' ? 'پایه '+stats.topGrade : '—'}</strong> ${stats.topCount>0 ? '('+toFa(stats.topCount)+' نفر)' : ''}</div>
    <div class="charts-grid"><div class="chart-box"><canvas id="gradeBarChart" height="220"></canvas></div><div class="chart-box"><canvas id="courseDonutChart" height="220"></canvas></div></div>
  </div>

  <div class="card report-card">
    <h2>فهرست معلمان (همه‌ی پایه‌ها و دوره‌ها)</h2>
    <p class="sub">قابل فیلتر بر اساس پایه، تاریخ و دوره — هر معلم برای هر روز یک سطر.</p>
    <div class="toolbar">
      <select id="dashFilterGrade"><option value="">همه پایه‌ها</option>${GRADES.map(g=>`<option value="${g}" ${gradeFilter===g?'selected':''}>پایه ${g}</option>`).join('')}</select>
      <select id="dashFilterCourse"><option value="">همه دوره‌ها</option>${COURSES.map(c=>`<option value="${c}" ${courseFilter===c?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    ${displayRows.length ? `
    <div class="table-wrap"><table style="width:${totalWidth}px;"><thead><tr>${reportHeaderRow()}</tr></thead><tbody>${displayRows.map(reportRowHtml).join('')}</tbody></table></div>
    <p class="sub" style="margin-top:8px;">تعداد معلم (سطر): ${toFa(displayRows.length)}</p>
    ` : '<p class="empty">هنوز رکوردی ثبت نشده</p>'}
  </div>`;
}
function renderCharts(){
  const stats = computeDashboardStats(window._dashDate || '');
  const barCtx = document.getElementById('gradeBarChart'), donutCtx = document.getElementById('courseDonutChart');
  if(!barCtx || !donutCtx || typeof Chart==='undefined') return;
  if(CHARTS.bar) CHARTS.bar.destroy();
  if(CHARTS.donut) CHARTS.donut.destroy();
  const gradeColors = ['#1B2E3C','#3E5568','#A63D40','#B08D2B','#3F6B4F','#6B4E9C'];
  CHARTS.bar = new Chart(barCtx, { type:'bar', data:{ labels: GRADES.map(g=>'پایه '+g), datasets:[{ label:'تعداد ثبت‌نام', data: GRADES.map(g=>stats.byGrade[g]||0), backgroundColor: gradeColors, borderRadius:4 }] }, options:{ responsive:true, plugins:{ legend:{display:false}, title:{display:true, text:'ثبت‌نام به تفکیک پایه', font:{family:'Vazirmatn', size:13} } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } } });
  const courseColors = ['#A63D40','#3E5568','#3F6B4F'];
  CHARTS.donut = new Chart(donutCtx, { type:'doughnut', data:{ labels: COURSES, datasets:[{ data: COURSES.map(c=>stats.byCourse[c]||0), backgroundColor: courseColors }] }, options:{ responsive:true, plugins:{ legend:{position:'bottom', labels:{font:{family:'Vazirmatn'}}}, title:{display:true, text:'سهم هر دوره', font:{family:'Vazirmatn', size:13} } } } });
}

/* ---------- MAIN RENDER ---------- */
function render(){
  document.getElementById('adminBar').innerHTML = renderAdminBar();

  document.querySelectorAll('#tabs button').forEach(b=>{ b.classList.toggle('active', b.dataset.tab===ACTIVE_TAB); });
  const app = document.getElementById('app');
  app.classList.toggle('wide', ACTIVE_TAB==='report');
  if(ACTIVE_TAB==='checkin') app.innerHTML = renderCheckin();
  else if(ACTIVE_TAB==='codes' && ADMIN_TOKEN) app.innerHTML = renderCodes();
  else if(ACTIVE_TAB==='report' && ADMIN_TOKEN) app.innerHTML = renderReport();
  else if(ACTIVE_TAB==='dashboard' && ADMIN_TOKEN){ app.innerHTML = renderDashboard(); setTimeout(renderCharts, 0); }
  else if(ACTIVE_TAB==='admin' && ADMIN_TOKEN){ app.innerHTML = renderAdminPanel(); initAdminPanel(); }

}

/* ---------- EVENTS ---------- */
function bindEvents(){
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.onclick = async ()=>{
      ACTIVE_TAB = b.dataset.tab;
      if(ACTIVE_TAB==='report' || ACTIVE_TAB==='dashboard') await loadAdminData();
      render();
    };
  });

  const copyLinkBtn = document.getElementById('copyLinkBtn');
  if(copyLinkBtn) copyLinkBtn.onclick = async ()=>{
    const text = document.getElementById('linkText').textContent;
    const msg = document.getElementById('copyMsg');
    try{ await navigator.clipboard.writeText(text); msg.textContent = 'کپی شد ✓'; }
    catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); msg.textContent='کپی شد ✓'; }
    setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000);
  };

  const sessionDateEl = document.getElementById('sessionDate');
  if(sessionDateEl) sessionDateEl.onchange = async ()=>{ await checkDeviceStatus(sessionDateEl.value); render(); };

  document.querySelectorAll('#periodRow input, #courseRow input').forEach(inp=>{
    inp.onchange = ()=>{ inp.closest('.radio-row').querySelectorAll('label').forEach(l=>l.classList.remove('checked')); inp.closest('label').classList.add('checked'); };
  });

  const lastNameField = document.getElementById('lastName');
  if(lastNameField && !document.getElementById('simplifiedMode')) lastNameField.addEventListener('blur', async ()=>{
    const first = document.getElementById('firstName').value.trim();
    const last = lastNameField.value.trim();
    if(!first || !last) return;
    const fullName = first + ' ' + last;
    const note = document.getElementById('reuseNote');
    let profile = null;
    try{
      const res = await fetch('/api/lookup', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fullName})});
      const result = await res.json();
      profile = result.profile;
    }catch(e){}
    if(!profile){ if(note) note.innerHTML=''; return; }
    const map = {personnelCode:'personnelCode', nationalCode:'nationalCode', gender:'gender', birthDate:'birthDate', maritalStatus:'maritalStatus', orgPosition:'orgPosition', grade:'grade', degree:'degree', teachingExperience:'teachingExperience', phone:'phone', workAddress:'workAddress', homeAddress:'homeAddress'};
    Object.keys(map).forEach(id=>{ const el = document.getElementById(id); if(el && profile[map[id]]) el.value = profile[map[id]]; });
    if(note){
      note.innerHTML = `اطلاعات فردی شما از ثبت‌نام قبلی پر شد. <button type="button" id="unlockFields" class="ghost-btn" style="padding:3px 8px; font-size:11px;">ویرایش</button>`;
      Object.keys(map).forEach(id=>{ const el = document.getElementById(id); if(el) el.style.background='var(--paper)'; });
      document.getElementById('unlockFields').onclick = ()=>{ Object.keys(map).forEach(id=>{ const el = document.getElementById(id); if(el) el.style.background='#fff'; }); note.innerHTML=''; };
    }
  });

  const submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.onclick = async ()=>{
    const box = document.getElementById('confirmBox');
    const simplified = !!document.getElementById('simplifiedMode');
    const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const course = document.querySelector('#courseRow input:checked');

    let payload;
    if(simplified){
      payload = {
        firstName: val('firstName'), lastName: val('lastName'), grade: val('grade'),
        sessionDate: document.getElementById('sessionDate') ? val('sessionDate') : window._lastSessionDate,
        period: val('period'), course: course?course.value:'', instructor: val('instructor'),
        personnelCode:'', nationalCode:'', gender:'', birthDate:'', maritalStatus:'', orgPosition:'',
        degree:'', teachingExperience:'', phone:'', workAddress:'', homeAddress:'',
        deviceId: getDeviceId(),
      };
      // pull remaining required personal fields from the profile server-side via lookup, since
      // the simplified form intentionally does not re-collect them.
      try{
        const res = await fetch('/api/lookup', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fullName: payload.firstName+' '+payload.lastName})});
        const result = await res.json();
        if(result.profile) Object.assign(payload, result.profile, {firstName:payload.firstName, lastName:payload.lastName, grade:payload.grade});
      }catch(e){}
    } else {
      const period = document.querySelector('#periodRow input:checked');
      payload = {
        firstName: val('firstName'), lastName: val('lastName'),
        personnelCode: toEnglishDigits(val('personnelCode')), nationalCode: toEnglishDigits(val('nationalCode')),
        gender: val('gender'), birthDate: val('birthDate'), maritalStatus: val('maritalStatus'), orgPosition: val('orgPosition'),
        grade: val('grade'), sessionDate: val('sessionDate'), period: period?period.value:'', course: course?course.value:'',
        instructor: val('instructor'), degree: val('degree'), teachingExperience: val('teachingExperience'),
        phone: toEnglishDigits(val('phone')), workAddress: val('workAddress'), homeAddress: val('homeAddress'),
        deviceId: getDeviceId(),
      };
      window._lastSessionDate = payload.sessionDate;
    }

    const required = ['firstName','lastName','personnelCode','nationalCode','gender','birthDate','maritalStatus','orgPosition','grade','sessionDate','period','course','instructor','degree','teachingExperience','phone','workAddress','homeAddress'];
    const missing = required.filter(k=> !payload[k]);
    if(missing.length){ box.innerHTML = `<div class="warn">لطفاً همه‌ی فیلدها را تکمیل کنید (${missing.length} فیلد ناقص).</div>`; return; }
    if(!/^\d{10}$/.test(payload.nationalCode)){ box.innerHTML = `<div class="warn">کد ملی باید دقیقاً ۱۰ رقم باشد.</div>`; return; }

    submitBtn.disabled = true;
    try{
      const resp = await fetch('/api/checkin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const result = await resp.json();
      if(result.status === 'duplicate'){
        box.innerHTML = `<div class="confirm">حضور شما قبلاً برای همین تاریخ و زنگ ثبت شده — نیازی به ثبت دوباره نیست.</div>`;
      } else if(result.status === 'device_limit'){
        box.innerHTML = `<div class="warn">این گوشی امروز بیش از ۲ بار برای ثبت‌نام استفاده شده است. هر گوشی فقط برای دو زنگ (حضور خود شما) مجاز است.</div>`;
      } else {
        const slot = result.record ? result.record[result.period] : null;
        const lateNote = slot && slot.status === 'تأخیر' ? ` — با تأخیر ${toFa(slot.delayMinutes)} دقیقه ثبت شد` : '';
        box.innerHTML = `<div class="confirm">✅ حضور شما ثبت شد${lateNote} — ${new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</div>`;
        await checkDeviceStatus(payload.sessionDate);
      }
    }catch(e){ box.innerHTML = `<div class="warn">اتصال به سرور برقرار نشد. دوباره تلاش کنید.</div>`; }
    submitBtn.disabled = false;
  };

  ['filterGrade','filterDate','filterCourse'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onchange = ()=>{ const f = getReportFilters(); if(id==='filterGrade') f.grade=el.value; if(id==='filterDate') f.date=el.value; if(id==='filterCourse') f.course=el.value; window._reportFilters=f; render(); };
  });
  const exportBtn = document.getElementById('exportExcel');
  if(exportBtn) exportBtn.onclick = ()=> exportReportExcel();

  const dashDateEl = document.getElementById('dashDate');
  if(dashDateEl) dashDateEl.onchange = ()=>{ window._dashDate = dashDateEl.value; render(); };
  const dashFilterGradeEl = document.getElementById('dashFilterGrade');
  if(dashFilterGradeEl) dashFilterGradeEl.onchange = ()=>{ window._dashGrade = dashFilterGradeEl.value; render(); };
  const dashFilterCourseEl = document.getElementById('dashFilterCourse');
  if(dashFilterCourseEl) dashFilterCourseEl.onchange = ()=>{ window._dashCourse = dashFilterCourseEl.value; render(); };
  const exportDashExcelBtn = document.getElementById('exportDashExcel');
  if(exportDashExcelBtn) exportDashExcelBtn.onclick = ()=> exportDashboardExcel();
  const exportDashPdfBtn = document.getElementById('exportDashPdf');
  if(exportDashPdfBtn) exportDashPdfBtn.onclick = ()=> exportDashboardPdf();

  const loginToggle = document.getElementById('adminLoginToggle');
  if(loginToggle) loginToggle.onclick = ()=>{ SHOW_LOGIN=true; render(); };
  const loginCancel = document.getElementById('loginCancelBtn');
  if(loginCancel) loginCancel.onclick = ()=>{ SHOW_LOGIN=false; render(); };
  const loginSubmit = document.getElementById('loginSubmitBtn');
  if(loginSubmit) loginSubmit.onclick = async ()=>{
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    try{
      const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p})});
      const result = await res.json();
      if(result.status==='ok'){
        ADMIN_TOKEN = result.token; ADMIN_USERNAME = u;
        localStorage.setItem('adminToken', ADMIN_TOKEN); localStorage.setItem('adminUsername', ADMIN_USERNAME);
        SHOW_LOGIN = false; ACTIVE_TAB = 'report';
        await loadAdminData(); render();
      } else { errBox.textContent = result.message || 'ورود ناموفق بود'; }
    }catch(e){ errBox.textContent = 'خطا در اتصال به سرور'; }
  };
  const logoutBtn = document.getElementById('adminLogoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=> adminLogout();

  const createAdminBtn = document.getElementById('createAdminBtn');
  if(createAdminBtn) createAdminBtn.onclick = async ()=>{
    const u = document.getElementById('newAdminUsername').value.trim();
    const p = document.getElementById('newAdminPassword').value;
    const msg = document.getElementById('createAdminMsg');
    if(!u || !p){ msg.innerHTML = '<div class="warn">نام کاربری و رمز عبور را وارد کنید.</div>'; return; }
    try{
      const res = await fetch('/api/admin/create-admin', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({username:u, password:p})});
      if(res.status===401){ adminLogout(); return; }
      const result = await res.json();
      if(result.status==='ok'){ msg.innerHTML = '<div class="confirm">مدیر جدید اضافه شد.</div>'; loadAdminList(); }
      else { msg.innerHTML = `<div class="warn">${result.message}</div>`; }
    }catch(e){ msg.innerHTML = '<div class="warn">خطا در اتصال</div>'; }
  };
}

/* ---------- EXPORTS ---------- */
const EXCEL_COLS = [
  {key:'row', label:'ردیف', width:6},
  {key:'firstName', label:'نام', width:14}, {key:'lastName', label:'نام خانوادگی', width:16},
  {key:'grade', label:'پایه', width:8}, {key:'sessionDateLabel', label:'تاریخ', width:20},
  {key:'p1Course', label:'زنگ اول - دوره', width:14}, {key:'p1Status', label:'زنگ اول - وضعیت', width:16}, {key:'p1Time', label:'زنگ اول - ساعت', width:12},
  {key:'p2Course', label:'زنگ دوم - دوره', width:14}, {key:'p2Status', label:'زنگ دوم - وضعیت', width:16}, {key:'p2Time', label:'زنگ دوم - ساعت', width:12},
  {key:'personnelCode', label:'کد پرسنلی', width:12}, {key:'nationalCode', label:'کد ملی', width:12},
  {key:'gender', label:'جنسیت', width:8}, {key:'birthDate', label:'تاریخ تولد', width:14},
  {key:'maritalStatus', label:'وضعیت تأهل', width:12}, {key:'orgPosition', label:'سمت سازمانی', width:18},
  {key:'degree', label:'مدرک تحصیلی', width:14}, {key:'teachingExperience', label:'سابقه تدریس', width:12},
  {key:'phone', label:'تلفن همراه', width:14}, {key:'workAddress', label:'آدرس محل کار', width:22},
  {key:'homeAddress', label:'آدرس منزل', width:22},
  {key:'p1Ip', label:'زنگ اول - IP', width:14}, {key:'p2Ip', label:'زنگ دوم - IP', width:14},
];
async function exportReportExcel(){
  const f = getReportFilters();
  const grouped = filteredGroups(f);
  const wb = new ExcelJS.Workbook();
  const sheet = wb.addWorksheet('حضور و غیاب', { views:[{ rightToLeft:true, state:'frozen', xSplit:5, ySplit:1 }] });
  sheet.columns = EXCEL_COLS.map(c=>({ header:c.label, key:c.key, width:c.width }));

  const periodText = (rec, field) => {
    if(!rec) return '—';
    if(field==='course') return rec.course;
    if(field==='status') return rec.status==='تأخیر' ? `تأخیر (${rec.delayMinutes} دقیقه)` : (rec.status==='حاضر' ? 'حاضر' : 'ثبت‌شده');
    if(field==='time') return new Date(rec.submittedAt).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
    if(field==='ip') return rec.ipAddress ?? '';
  };

  grouped.forEach((g,i)=>{
    const dateInfo = SESSION_DATES.find(d=>d.jalali===g.sessionDate);
    const row = sheet.addRow({
      row:i+1, firstName:g.firstName, lastName:g.lastName, grade:g.grade, sessionDateLabel: dateInfo?dateInfo.label:g.sessionDate,
      p1Course: periodText(g.p1,'course'), p1Status: periodText(g.p1,'status'), p1Time: periodText(g.p1,'time'),
      p2Course: periodText(g.p2,'course'), p2Status: periodText(g.p2,'status'), p2Time: periodText(g.p2,'time'),
      personnelCode:g.personnelCode, nationalCode:g.nationalCode, gender:g.gender, birthDate:g.birthDate, maritalStatus:g.maritalStatus,
      orgPosition:g.orgPosition, degree:g.degree, teachingExperience:g.teachingExperience, phone:g.phone,
      workAddress:g.workAddress, homeAddress:g.homeAddress,
      p1Ip: periodText(g.p1,'ip'), p2Ip: periodText(g.p2,'ip'),
    });
    const isEven = i % 2 === 0;
    row.eachCell(cell=>{
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: isEven ? 'FFEFF4EF' : 'FFFFFFFF' } };
      cell.border = { top:{style:'thin',color:{argb:'FFD7DCD4'}}, bottom:{style:'thin',color:{argb:'FFD7DCD4'}}, left:{style:'thin',color:{argb:'FFD7DCD4'}}, right:{style:'thin',color:{argb:'FFD7DCD4'}} };
      cell.alignment = { horizontal:'right', vertical:'middle' };
    });
    if(g.p1){ const c=row.getCell('p1Status'); c.fill = { type:'pattern', pattern:'solid', fgColor:{argb: g.p1.status==='تأخیر'?'FFF6D9D6':'FFDCE8DE'} }; }
    if(g.p2){ const c=row.getCell('p2Status'); c.fill = { type:'pattern', pattern:'solid', fgColor:{argb: g.p2.status==='تأخیر'?'FFF6D9D6':'FFDCE8DE'} }; }
  });
  const headerRow = sheet.getRow(1);
  headerRow.eachCell(cell=>{ cell.font = { bold:true, color:{argb:'FFFFFFFF'}, size:11 }; cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1B2E3C'} }; cell.alignment = { horizontal:'center', vertical:'middle' }; cell.border = { bottom:{style:'medium', color:{argb:'FFB08D2B'}} }; });
  headerRow.height = 26;
  const lastCol = EXCEL_COLS.length <= 26 ? String.fromCharCode(64+EXCEL_COLS.length) : 'A'+String.fromCharCode(64+EXCEL_COLS.length-26);
  sheet.autoFilter = { from:'A1', to: lastCol + '1' };
  const buffer = await wb.xlsx.writeBuffer();
  downloadBlob(buffer, 'attendance-report.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
async function exportDashboardExcel(){
  const dateFilter = window._dashDate || '';
  const stats = computeDashboardStats(dateFilter);
  const wb = new ExcelJS.Workbook();
  const sheet = wb.addWorksheet('داشبورد', { views:[{ rightToLeft:true }] });
  sheet.columns = [{width:26},{width:16}];
  sheet.mergeCells('A1:B1');
  const titleCell = sheet.getCell('A1');
  titleCell.value = 'داشبورد حضور و غیاب — ' + (dateFilter ? (SESSION_DATES.find(d=>d.jalali===dateFilter)||{}).label : 'همه‌ی تاریخ‌ها');
  titleCell.font = { bold:true, size:14, color:{argb:'FFFFFFFF'} };
  titleCell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1B2E3C'} };
  titleCell.alignment = { horizontal:'center', vertical:'middle' };
  sheet.getRow(1).height = 26;
  let r = 3;
  [['کل ثبت‌نام‌ها', stats.total], ['حاضر به‌موقع', stats.onTime], ['با تأخیر', stats.late], ['درصد به‌موقع بودن', stats.pct + '٪']].forEach(([label,val])=>{
    sheet.getCell('A'+r).value = label; sheet.getCell('B'+r).value = val;
    sheet.getCell('A'+r).font = { bold:true }; sheet.getCell('A'+r).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFEFF4EF'} };
    r++;
  });
  r += 1;
  sheet.mergeCells('A'+r+':B'+r); sheet.getCell('A'+r).value = 'به تفکیک پایه';
  sheet.getCell('A'+r).font = { bold:true, color:{argb:'FFFFFFFF'} }; sheet.getCell('A'+r).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF3E5568'} };
  r++;
  GRADES.forEach(g=>{ sheet.getCell('A'+r).value = 'پایه '+g; sheet.getCell('B'+r).value = stats.byGrade[g]||0; r++; });
  r += 1;
  sheet.mergeCells('A'+r+':B'+r); sheet.getCell('A'+r).value = 'به تفکیک دوره';
  sheet.getCell('A'+r).font = { bold:true, color:{argb:'FFFFFFFF'} }; sheet.getCell('A'+r).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF3E5568'} };
  r++;
  const courseColorsHex = ['FFF6D9D6','FFDCE3EE','FFDCE8DE'];
  COURSES.forEach((c,i)=>{
    sheet.getCell('A'+r).value = c; sheet.getCell('B'+r).value = stats.byCourse[c]||0;
    sheet.getCell('A'+r).fill = { type:'pattern', pattern:'solid', fgColor:{argb:courseColorsHex[i]} };
    sheet.getCell('B'+r).fill = { type:'pattern', pattern:'solid', fgColor:{argb:courseColorsHex[i]} };
    r++;
  });
  sheet.eachRow(row=> row.eachCell(cell=>{ cell.border = { top:{style:'thin',color:{argb:'FFD7DCD4'}}, bottom:{style:'thin',color:{argb:'FFD7DCD4'}}, left:{style:'thin',color:{argb:'FFD7DCD4'}}, right:{style:'thin',color:{argb:'FFD7DCD4'}} }; if(!cell.alignment) cell.alignment = { horizontal:'right', vertical:'middle' }; }));
  const buffer = await wb.xlsx.writeBuffer();
  downloadBlob(buffer, 'dashboard-summary.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
async function exportDashboardPdf(){
  const target = document.getElementById('dashboardCapture');
  if(!target || typeof html2canvas==='undefined' || typeof window.jspdf==='undefined') return;
  const canvas = await html2canvas(target, { scale:2, backgroundColor:'#ffffff' });
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
  const pageWidth = pdf.internal.pageSize.getWidth(), pageHeight = pdf.internal.pageSize.getHeight();
  const ratio = canvas.height / canvas.width;
  let w = pageWidth - 40, h = w * ratio;
  if(h > pageHeight - 40){ h = pageHeight - 40; w = h / ratio; }
  pdf.addImage(imgData, 'PNG', (pageWidth-w)/2, 20, w, h);
  pdf.save('dashboard.pdf');
}
